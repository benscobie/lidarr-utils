version: 2

builds:
  - binary: lidarr-utils
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -w -s -X github.com/benscobie/lidarr-utils/cmd.version={{.Version}}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - config.example.yaml

checksum:
  name_template: "checksums.txt"

release:
  preflight:
    fail_on_error: true

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
    - title: Others
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'

dockers_v2:
  - images:
      - "ghcr.io/benscobie/lidarr-utils"
      - "benscobie/lidarr-utils"
    tags:
      - "{{ .Version }}"
      - '{{ if eq .Prerelease "" }}{{ .Major }}{{ end }}'
    dockerfile: Dockerfile.goreleaser
    annotations:
      "index,manifest:org.opencontainers.image.source": "https://github.com/benscobie/lidarr-utils"
      "index,manifest:org.opencontainers.image.revision": "{{ .FullCommit }}"
      "index,manifest:org.opencontainers.image.version": "{{ .Version }}"
      "index,manifest:org.opencontainers.image.licenses": "MIT"
      "index,manifest:org.opencontainers.image.base.name": "{{ .BaseImage }}"
      "index,manifest:org.opencontainers.image.base.digest": "{{ .BaseImageDigest }}"
    extra_files:
      - config.example.yaml
    platforms:
      - linux/amd64
      - linux/arm64
