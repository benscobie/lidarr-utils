# Example configuration file for lidarr-utils
# Copy this file to config.yaml and adjust the settings for your environment

# Lidarr connection settings
lidarr:
  url: "http://localhost:8686"  # Your Lidarr URL
  api_key: "your-api-key-here"  # Your Lidarr API key

# Application settings
app:
  dry_run: false                  # Set to true for a dry run (preview only)
  log_level: "info"               # Log level: debug, info, warn, error
  log_file: "lidarr-utils.log"   # Path to log file (optional)
  # state_file: /home/user/.lidarr-utils/state.json  # Path to state file (auto-resolved from config dir)

# Dedupe command settings
dedupe:
  add_import_exclusion: false     # Add removed singles to import exclusion list

  schedule:
    enabled: false
    cron: "0 2 * * *"
    run_on_start: false

monitor:
  artists:
    selection:
      include_secondary_types: true
      exclude_secondary_types: []
      exclude_formats: []
      various_artists: include          # include | exclude | only
      compilation_singles: include      # include | exclude
      skip_fully_covered_releases: true

    schedule:
      enabled: false
      cron: "0 2 * * *"
      run_on_start: false

  labels:
    ids:
      - "a5bfec28-ea8f-426d-ab23-e14aa692c9b5"
    missing_artists:
      enabled: false                    # Set true to add releases when their owning artist is absent
      root_folder: ""
    selection:
      include_secondary_types: true
      exclude_secondary_types: []
      exclude_formats: []
      various_artists: only
      compilation_singles: include
      skip_fully_covered_releases: true

    schedule:
      enabled: false
      cron: "0 */6 * * *"
      run_on_start: false
