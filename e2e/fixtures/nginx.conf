events {}

http {
  access_log /work/fixtures/access.log;

  server {
    listen 80;
    server_name _;

    location = /health.json {
      default_type application/json;
      alias /fixtures/health.json;
    }

    location ~ ^/api/v0\.4/artist/([0-9a-f-]+)$ {
      default_type application/json;
      try_files /lidarr/artist/$1.json =404;
      root /fixtures;
    }

    location ~ ^/api/v0\.4/album/([0-9a-f-]+)$ {
      default_type application/json;
      try_files /lidarr/album/$1.json =404;
      root /fixtures;
    }

    location = /ws/2/release {
      default_type application/json;
      alias /fixtures/musicbrainz/releases.json;
    }
  }
}
